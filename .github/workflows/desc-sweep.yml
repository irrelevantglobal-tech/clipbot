name: desc-sweep
# Kick pivot (owner 18 Nov): existing YouTube descriptions on Leon's channel: the Twitch link -> his Kick address
# (clipbot/desc_sweep.py: exact-match pairs only, anything else skipped and listed). Dry unless apply=true; capped by
# max_units (the 10k/day pool is shared by every lane). Pristine copies + the report go into an ENCRYPTED release
# (public repo: private videos' text stays private). Run by hand, one capped run per quota day, until nothing is left.
on:
  schedule:
    - cron: "15 7 * * *"   # boss 18 Nov: daily 07:15 UTC = the END of each quota day (resets 08:00 UK): only what the uploads left; quota out = clean stop. 7000 max. REMOVE when the run says the sweep is done
  workflow_dispatch:
    inputs:
      apply: {description: "true = change descriptions (false = dry run, ~30 units)", type: boolean, default: false}
      max_units: {description: "stop before this many quota units (50 per video)", default: "3000"}
      comments: {description: "read only: list Leon's own comments that mention Twitch (no descriptions touched)", type: boolean, default: false}
      status_ids: {description: "read only: comma video ids -> privacy + scheduled time (nothing else runs)", default: ""}
permissions:
  contents: write   # the encrypted backup/report release
concurrency:
  group: desc-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      MAXU: ${{ inputs.max_units || '7000' }}   # boss 18 Nov: up to 7000/day on the sweep, >=3000 left for uploads
      COMMENTS: ${{ inputs.comments }}
      STATUS_IDS: ${{ inputs.status_ids }}
      CLIPBOT_WHO: leon
      CLIPBOT_ZIP_KEY: ${{ secrets.CLIPBOT_ZIP_KEY }}
      CLIPBOT_ID: ${{ secrets.CLIPBOT_ID }}   # channel identity (names live only in this secret: the repo is public)
      KICK_SLUG: ${{ secrets.KICK_SLUG }}
      KICK_SLUG_PUBLIC: ${{ vars.KICK_SLUG_PUBLIC }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_COMMENT_REFRESH_TOKEN: ${{ (github.event_name == 'schedule' || inputs.apply || inputs.comments) && secrets.YT_COMMENT_REFRESH_TOKEN || '' }}   # Leon's own comments: list (comments=true) or edit to Kick (apply)
    steps:
      - name: Check input
        run: '[[ "$MAXU" =~ ^[0-9]{1,5}$ && "$MAXU" -le 7000 ]] || { echo "max_units must be 0-7000"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Sweep
        run: |
          [[ -z "$STATUS_IDS" || "$STATUS_IDS" =~ ^[A-Za-z0-9_,-]{11,600}$ ]] || { echo "bad ids"; exit 1; }
          if [ -n "$STATUS_IDS" ]; then python -m clipbot.desc_sweep --status "$STATUS_IDS"; exit 0; fi
          python -m clipbot.desc_sweep --out out --max-units "$MAXU" $([ "$COMMENTS" = true ] && echo --comments) $([ "$APPLY" = true ] && [ "$COMMENTS" != true ] && echo --apply)
      - name: Keep the pristine copies + report (encrypted release)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d out ] || exit 0
          [ -n "$CLIPBOT_ZIP_KEY" ] || { echo "CLIPBOT_ZIP_KEY missing: refusing to upload unencrypted backups"; exit 1; }
          NAME="desc-sweep-$GITHUB_RUN_ID"
          (cd out && zip -q -r "../$NAME.zip" .)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLIPBOT_ZIP_KEY -in "$NAME.zip" -out "$NAME.zip.enc"
          gh release create "$NAME" "$NAME.zip.enc" --title "$NAME" --notes "desc-sweep run $GITHUB_RUN_ID (apply=$APPLY): pristine descriptions + report, encrypted."
