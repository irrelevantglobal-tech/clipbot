# Polished marathon episodes (polished/conductor.py): the recipe that passed the owner's blind test,
# on a cloud GPU (lane 1 Modal, lane 2 Vast.ai), conducted from here so no laptop is ever involved.
# Started by hand (tests) or from episodes.yml when the repo variable EP_POLISHED is "1" (OFF by default).
# upload=false never touches YouTube. upload=true uploads PRIVATE with no schedule; approval in Discord
# sets the date. Nothing here can make a video public.
name: polished
on:
  workflow_dispatch:
    inputs:
      vod: {description: Twitch VOD id, required: true}
      from: {description: window start (VOD seconds), default: "0"}
      to: {description: window end (VOD seconds, 0 = end), default: "0"}
      final: {description: the VOD has ended (emit the tail too), type: boolean, default: false}
      series: {description: series name in titles, default: GTA 6}
      upload: {description: upload PRIVATE (no schedule), type: boolean, default: false}
      offer: {description: send uploaded episodes to Discord for approval, type: boolean, default: false}
      lane: {description: GPU lane, type: choice, options: [auto, modal, vast], default: auto}
      max_episodes: {description: test only, plan the first N (0 = all), default: "0"}
      keep: {description: test only, keep the first N mp4s as an encrypted artifact (upload=false), default: "0"}
      answers: {description: lane 4 (encrypted, from polished/hold.py), default: ""}
      faults: {description: "QA only, ignored when upload=true: comma list (see conductor.FAULT_HELP)", default: ""}
      fresh: {description: "ignore this window's saved state (re-analyse and re-plan; costs GPU + API again)", type: boolean, default: false}
      redo_chunk: {description: "re-analyse only this saved chunk (its start, VOD seconds) and re-plan the window", default: ""}
      replan: {description: "keep the saved analysis, re-plan + re-render + re-review the window (no GPU analysis)", type: boolean, default: false}
  workflow_call:
    inputs:
      vod: {type: string, required: true}
      from: {type: string, default: "0"}
      to: {type: string, default: "0"}
      final: {type: boolean, default: false}
      series: {type: string, default: GTA 6}
      upload: {type: boolean, default: false}
      offer: {type: boolean, default: true}
      lane: {type: string, default: auto}
      max_episodes: {type: string, default: "0"}
      keep: {type: string, default: "0"}
      answers: {type: string, default: ""}
      faults: {type: string, default: ""}
      fresh: {type: boolean, default: false}
      redo_chunk: {type: string, default: ""}
      replan: {type: boolean, default: false}
permissions:
  contents: read
  actions: read          # the ledger + state artifacts of earlier runs
  id-token: write        # Gemini fallback: GitHub OIDC -> Google (Workload Identity Federation), no stored key
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # under the worker's 6 h EP_STALE
    concurrency:
      group: polished-${{ inputs.vod }}
      cancel-in-progress: false
    env:
      CLIPBOT_ZIP_KEY: ${{ secrets.CLIPBOT_ZIP_KEY }}
      VOD: ${{ inputs.vod }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      SERIES: ${{ inputs.series }}
      MAXEP: ${{ inputs.max_episodes }}
      KEEP: ${{ inputs.keep }}
      LANE: ${{ inputs.lane }}
      PYTHONUNBUFFERED: "1"
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CLIPBOT_ID: ${{ secrets.CLIPBOT_ID }}
      CLIPBOT_WORKER: ${{ secrets.CLIPBOT_WORKER }}
      CLIPBOT_TOKEN: ${{ secrets.CLIPBOT_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # modal_down drill (dry runs only): every Modal call in the job is refused, as if Modal were capped or down
      MODAL_TOKEN_ID: ${{ (contains(inputs.faults, 'modal_down') && !inputs.upload) && 'ak-modal-down-drill' || secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ (contains(inputs.faults, 'modal_down') && !inputs.upload) && 'as-modal-down-drill' || secrets.MODAL_TOKEN_SECRET }}
      GTA6_ANTHROPIC_KEY: ${{ secrets.GTA6_ANTHROPIC_KEY }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      GTA6_API_BUDGET: ${{ vars.GTA6_API_BUDGET }}
      GTA6_API_SINCE: ${{ vars.GTA6_API_SINCE }}
      GTA6_MODAL_HANDOFF: ${{ vars.GTA6_MODAL_HANDOFF }}
      # Gemini on Vertex AI = FALLBACK when the Claude budget is dry (polished/gemini.py). Unset budget = off (HOLD).
      GTA6_GEMINI_BUDGET: ${{ vars.GTA6_GEMINI_BUDGET }}
      GTA6_GEMINI_SINCE: ${{ vars.GTA6_GEMINI_SINCE }}
      GTA6_GEMINI_PLAN_MODEL: ${{ vars.GTA6_GEMINI_PLAN_MODEL }}
      GTA6_GEMINI_REVIEW_MODEL: ${{ vars.GTA6_GEMINI_REVIEW_MODEL }}
      GTA6_GCP_PROJECT: ${{ vars.GTA6_GCP_PROJECT }}
      # Sleep skip (polished/sleepskip.py): "1" = skip GPU analysis of Resting-screen stretches nobody talks over.
      GTA6_SLEEP_SKIP: ${{ vars.GTA6_SLEEP_SKIP }}
      GITHUB_TOKEN: ${{ github.token }}
      POLISHED_FAULTS: ${{ inputs.faults }}
      POLISHED_DRY: ${{ inputs.upload && '0' || '1' }}
      STATE_NAME: gta6-state-${{ inputs.vod }}-${{ inputs.from }}
    steps:
      - name: Check input
        run: |
          [[ "$VOD" =~ ^[0-9]{6,14}$ ]] || { echo "bad vod id"; exit 1; }
          [[ "$FROM" =~ ^[0-9]+(\.[0-9]+)?$ && "$TO" =~ ^[0-9]+(\.[0-9]+)?$ && "$MAXEP" =~ ^[0-9]+$ && "$KEEP" =~ ^[0-9]+$ ]] || { echo "bad numbers"; exit 1; }
          [[ "$SERIES" =~ ^[A-Za-z0-9\ :\'-]{2,40}$ ]] || { echo "bad series"; exit 1; }
          [[ "$LANE" =~ ^(auto|modal|vast)$ ]] || { echo "bad lane"; exit 1; }
          [[ "$POLISHED_FAULTS" =~ ^[a-z0-9_,]*$ ]] || { echo "bad faults"; exit 1; }
          [[ -n "$CLIPBOT_ZIP_KEY" ]] || { echo "no CLIPBOT_ZIP_KEY: state would be public, refusing"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Room on the runner (episodes are ~2 GB each)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - run: for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && break; echo "apt failed ($i), retrying in 30 s"; sleep 30; done; command -v ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt modal numpy pillow google-auth
      - name: Sleep-skip CPU tools (only with GTA6_SLEEP_SKIP=1; if this fails the check fails open = everything scanned)
        if: vars.GTA6_SLEEP_SKIP == '1'
        continue-on-error: true
        run: pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q open_clip_torch==2.29.0
      - name: Cache the sleep-skip models (CLIP ViT-B-32, whisper tiny.en)
        if: vars.GTA6_SLEEP_SKIP == '1'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sleepskip-models-v1
      - name: Google Cloud sign-in for the Gemini fallback (keyless; a failure here only means Claude-dry windows HOLD)
        if: vars.GTA6_GEMINI_BUDGET != '' && vars.GTA6_GCP_WIF_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GTA6_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GTA6_GCP_SA }}
      - name: Restore this window's state from an earlier attempt (no second analysis, no second plan call)
        if: ${{ !inputs.fresh }}
        run: |
          mkdir -p state
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_NAME&per_page=1" --jq '.artifacts[0] | select(.expired == false) | .id' || true)
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > st.zip && unzip -q -o st.zip -d st_in
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLIPBOT_ZIP_KEY -in st_in/state.tgz.enc | tar xz -C state
            echo "restored $(ls state | wc -l) state file(s) from artifact $id"; rm -rf st.zip st_in
          else echo "no earlier state"; fi
      - run: mkdir -p state
      - name: Re-plan from the saved analysis
        if: ${{ inputs.replan }}
        run: rm -rf state/plans.json state/plan_* state/review_* && echo "plans and reviews start again; analysis kept"
      - name: Re-analyse one chunk, re-plan the window
        if: ${{ inputs.redo_chunk != '' }}
        env:
          REDO: ${{ inputs.redo_chunk }}
        run: |
          [[ "$REDO" =~ ^[0-9]+$ ]] || { echo "bad redo_chunk"; exit 1; }
          rm -rf "state/chunk_$REDO.json" state/analysis.json state/plans.json state/plan_* state/review_*
          echo "chunk $REDO will be re-analysed; plans and reviews start again"
      - name: Camp sting media (intro/outro footage + music, sha256-checked against manifest.json)
        env:
          CAMP_ASSETS_URL: ${{ secrets.CAMP_ASSETS_URL }}
          CAMP_ASSETS_TOKEN: ${{ secrets.CAMP_ASSETS_TOKEN }}
          CAMP_MEDIA_DEPLOY_KEY: ${{ secrets.CAMP_MEDIA_DEPLOY_KEY }}   # read-only key to the private media repo
        run: python -m polished.brand.camp_fetch     # private GitHub copy first, Modal volume second
      - name: Deploy the GPU app (lane 1)
        id: deploy
        if: env.MODAL_TOKEN_ID != ''
        continue-on-error: true      # Modal capped or down must not stop the window: the conductor picks Vast
        run: modal deploy polished/modal_app.py
      - name: Lane 4 answers
        if: inputs.answers != ''
        env:
          ANSWERS: ${{ inputs.answers }}
        run: printf '%s' "$ANSWERS" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLIPBOT_ZIP_KEY | gunzip > answers.json
      - name: Polish the window
        env:
          MODAL_DEPLOYED: ${{ steps.deploy.outcome }}
        run: |
          args=(--vod "$VOD" --from "$FROM" --to "$TO" --series "$SERIES" --lane "$LANE" --max-episodes "$MAXEP" --keep "$KEEP" --state state --out out)
          [[ "${{ inputs.final }}" == "true" ]] && args+=(--final)
          [[ "${{ inputs.upload }}" == "true" ]] && args+=(--upload)
          [[ -f answers.json ]] && args+=(--answers answers.json)
          python -m polished.conductor "${args[@]}"
      - name: Send uploaded episodes for approval
        if: always() && inputs.upload && inputs.offer
        env:
          PARTIAL: ${{ job.status != 'success' }}
        run: |
          [[ -f out/episodes.json ]] || { echo "no manifest"; exit 0; }
          python - <<'PY'
          import json, os
          from clipbot import common
          m = json.load(open("out/episodes.json", encoding="utf-8"))
          m["run_id"] = os.environ["GITHUB_RUN_ID"]
          if os.environ.get("PARTIAL") == "true":
              m["partial"] = True
              m.pop("next_from", None)
              m["final"] = False
          print(common.worker("/clipbot/epoffer", m))
          PY
      - name: Encrypt the state (the repo is public)
        if: always()
        run: |
          [ -d state ] && [ -n "$(ls -A state)" ] || exit 0
          mkdir -p st_out && tar cz -C state . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLIPBOT_ZIP_KEY -out st_out/state.tgz.enc
          [ -f out/episodes.json ] && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLIPBOT_ZIP_KEY -in out/episodes.json -out st_out/manifest.json.enc || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.STATE_NAME }}
          path: st_out/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
          compression-level: 0
      - name: Ledger name
        if: always()
        id: led
        run: echo "name=$(cat out/ledger_name.txt 2>/dev/null || echo gta6-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-api0-modal0-vast0)" >> "$GITHUB_OUTPUT" && mkdir -p led && date -u > led/at.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.led.outputs.name }}
          path: led/
          retention-days: 90
      - name: Encrypt kept test episodes
        if: always() && !inputs.upload && inputs.keep != '0'
        run: |
          mkdir -p kept; shopt -s nullglob
          for f in out/keep_ep*.mp4; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLIPBOT_ZIP_KEY -in "$f" -out "kept/$(basename "$f").enc"; done
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.upload && inputs.keep != '0'
        with:
          name: polished-kept-${{ inputs.vod }}-${{ inputs.from }}
          path: kept/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
      - name: Tell the owner it failed (and free the window so the worker re-runs it)
        if: failure() || cancelled()
        run: |
          # the conductor posts its own "died" line; this covers a client killed before it could
          [ -f out/status_died.txt ] || python -m polished.status died "$VOD" "$FROM" "$TO"             "the job stopped without reporting (runner killed or cancelled). Nothing half-made was uploaded." || true
          # "episodes <vod> from <s>" is the id the worker frees a window on; tests use another id (no window to free)
          # A test run (upload=false) has no window to free and must never DM the phone: its [TEST] status line is enough.
          [[ "${{ inputs.upload }}" == "true" ]] || exit 0
          id="episodes $VOD from $FROM"
          curl -s -X POST -H "Authorization: Bearer $CLIPBOT_TOKEN" -H "Content-Type: application/json"             -A "ClipBot/1.0" -d "{\"id\":\"$id\",\"error\":\"GitHub run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed\"}"             $CLIPBOT_WORKER/clipbot/failed || true
