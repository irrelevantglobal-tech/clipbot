name: sleep-skip probe (CPU only, no GPU, no secrets)
# Runs ONLY the sleep-skip check (polished/sleepskip.py) on a VOD window and saves its report. $0: an Actions
# runner, Twitch's public playlists and two public models; nothing is rented, posted or uploaded.
on:
  workflow_dispatch:
    inputs:
      vod: {description: "Twitch VOD id", required: true}
      from: {description: "window start, VOD seconds", default: "0"}
      to: {description: "window end, VOD seconds (0 = the end)", default: "0"}
      presses: {description: 'test presses as JSON in VOD seconds, e.g. [{"t":3600,"mode":"asleep"}]', default: "[]"}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOD: ${{ inputs.vod }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      PRESSES: ${{ inputs.presses }}
    steps:
      - name: Check input
        run: |
          [[ "$VOD" =~ ^[0-9]{6,14}$ ]] || { echo "bad vod id"; exit 1; }
          [[ "$FROM" =~ ^[0-9]+(\.[0-9]+)?$ && "$TO" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "bad numbers"; exit 1; }
          printf '%s' "$PRESSES" | python3 -c "import json,sys; p=json.load(sys.stdin); assert isinstance(p, list) and len(p) < 50" || { echo "bad presses"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; sleep 30; done; command -v ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt numpy && pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q open_clip_torch==2.29.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sleepskip-models-v1
      - name: Probe
        run: |
          printf '%s' "$PRESSES" > presses.json
          python -m polished.sleepskip probe --vod "$VOD" --from "$FROM" --to "$TO" --presses presses.json --out sleepskip-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sleepskip-report-${{ inputs.vod }}-${{ inputs.from }}
          path: sleepskip-report.json
          retention-days: 14
