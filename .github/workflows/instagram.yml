# Posts the Shorts publish.py scheduled on YouTube to Instagram as Reels once their slot has passed
# (Instagram's API cannot schedule). Runs just after every slot hour (10/13/18/21 UK, both GMT and BST).
name: instagram
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = do everything except the final publish"
        default: "0"
  # Times are UTC. Re-pushed 2026-10-30: schedules stopped firing after the repo went public.
  schedule:
    - cron: "5 9,10,12,13,17,18,20,21 * * *"
concurrency:
  group: instagram
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  instagram:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GO == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLIPBOT_ZIP_KEY: ${{ secrets.CLIPBOT_ZIP_KEY }}   # clip zips + debug files are encrypted (public repo)
      CLIPBOT_TOKEN: ${{ secrets.CLIPBOT_TOKEN }}
      CLIPBOT_ID: ${{ secrets.CLIPBOT_ID }}   # channel identity (names live only in this secret: the repo is public)
      CLIPBOT_WORKER: ${{ secrets.CLIPBOT_WORKER }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IG_DRY: ${{ inputs.dry || '0' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Anything due?
        id: q
        run: |
          n=$(curl -sf -A clipbot -H "Authorization: Bearer $CLIPBOT_TOKEN" $CLIPBOT_WORKER/clipbot/igqueue | python3 -c "
          import sys, json, datetime
          q = json.load(sys.stdin)
          now = datetime.datetime.now(datetime.timezone.utc)
          due = [i for i in q['items'] if datetime.datetime.fromisoformat(i['at'].replace('Z', '+00:00')) <= now]
          print(len(due) if q.get('login') else 0)")
          echo "due: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"
          x=$(curl -sf -A clipbot -H "Authorization: Bearer $CLIPBOT_TOKEN" $CLIPBOT_WORKER/clipbot/xqueue | python3 -c "
          import sys, json, datetime
          q = json.load(sys.stdin)
          now = datetime.datetime.now(datetime.timezone.utc)
          print(sum(datetime.datetime.fromisoformat(i['at'].replace('Z', '+00:00')) <= now for i in q['items']))") || x=0
          echo "x due: $x"; echo "x=$x" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$n" != 0 ] || [ "$x" != 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      # Owner 2026-10-31: our own comment on each ClipBot Short once it is public (stdlib only, no installs).
      # Never blocks the Reels.
      - name: YouTube comments
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_COMMENT_REFRESH_TOKEN: ${{ secrets.YT_COMMENT_REFRESH_TOKEN }}
          YTC_DRY: ${{ inputs.dry || '0' }}
        run: python3 -m clipbot.yt_comments
      - uses: actions/setup-python@v5
        if: steps.q.outputs.any == '1'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.q.outputs.any == '1'
        run: |
          for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; echo "apt failed ($i), retrying in 30 s"; sleep 30; done; command -v ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Post Reels
        if: steps.q.outputs.n != '0'
        run: python -m clipbot.instagram
      # Owner 2026-11-14: the same clips on X, through Buffer's free plan. After the Reels so it never delays them.
      - name: Post to X
        if: always() && steps.q.outputs.x != '0' && steps.q.outputs.x != ''
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          X_DRY: ${{ inputs.dry || '0' }}
        run: python -m clipbot.x
