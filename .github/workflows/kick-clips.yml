# Kick pivot (owner 17 Nov): viewer clips on Kick -> Shorts cards, like clip-offer.yml for Twitch. Started by the
# worker (hourly while live, once after); this job lists the clips itself (Workers cannot read Kick's public JSON) and
# the worker's /clipbot/kickclips says which are new. Uploads nothing: publish.yml only takes clips he approved.
name: kick-clips
on:
  workflow_dispatch:
    inputs:
      clips:
        description: "re-run only: comma-separated Kick clip ids (empty = new clips, claimed with the worker)"
        default: ""
permissions:
  contents: write   # clips are kept as a GitHub Release (artifacts hit the 0.5 GB quota 2026-10-28)
  id-token: write   # vision copy writer on Gemini (Vertex): GitHub OIDC -> Google, no stored key (19 Nov)
jobs:
  offer:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GO == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLIPBOT_ZIP_KEY: ${{ secrets.CLIPBOT_ZIP_KEY }}   # clip zips + debug files are encrypted (public repo)
      CLIPS: ${{ inputs.clips }}
      CLIPBOT_WHO: leon
      KICK_SLUG: ${{ secrets.KICK_SLUG }}
      KICK_CHANNEL_ID: ${{ secrets.KICK_CHANNEL_ID }}   # the slug must BE this channel, or nothing is read
      CLIPBOT_TOKEN: ${{ secrets.CLIPBOT_TOKEN }}
      CLIPBOT_ID: ${{ secrets.CLIPBOT_ID }}   # channel identity (names live only in this secret: the repo is public)
      KICK_SLUG_PUBLIC: ${{ vars.KICK_SLUG_PUBLIC }}   # 1 = the address may go in public copy
      CLIPBOT_WORKER: ${{ secrets.CLIPBOT_WORKER }}
      # Boss 19 Nov: viewer clips get the vision copy writer too (Gemini; Haiku if the Google sign-in is refused)
      GTA6_ANTHROPIC_KEY: ${{ secrets.GTA6_ANTHROPIC_KEY }}
      CLIPBOT_VISION_BUDGET: ${{ vars.CLIPBOT_VISION_BUDGET }}
      CLIPBOT_VISION_GEM_BUDGET: ${{ vars.CLIPBOT_VISION_GEM_BUDGET }}
      CLIPBOT_VISION_MODELS: ${{ vars.CLIPBOT_VISION_MODELS }}
      GTA6_GCP_PROJECT: ${{ vars.GTA6_GCP_PROJECT }}
    steps:
      - name: Check input
        run: '[[ "$CLIPS" =~ ^[A-Za-z0-9_,-]{0,1300}$ ]] || { echo "bad clip ids"; exit 1; }'
      - uses: actions/checkout@v4
      - name: Google Cloud sign-in for the copy writer (keyless; a failure only means the Haiku fallback)
        if: vars.GTA6_GCP_WIF_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GTA6_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GTA6_GCP_SA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; echo "apt failed ($i), retrying in 30 s"; sleep 30; done; command -v ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-small.en-v1
      - name: Render clips + write copy
        id: r
        run: python -m clipbot.kick_clips --clips "$CLIPS" --out out
      - name: Keep the clips for publish (GitHub Release, not artifact storage)
        if: steps.r.outputs.batch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ steps.r.outputs.batch }}
        run: |
          NAME="clips-$BATCH"; [ "$CLIPBOT_WHO" = leon ] || NAME="clips-$CLIPBOT_WHO-$BATCH"   # = common.release_name
          (cd out && shopt -s nullglob && f=(clip*.mp4 raw*.mp4 manifest.json) && zip -0 -q "../$NAME.zip" "${f[@]}")
          [ -n "$CLIPBOT_ZIP_KEY" ] || { echo "CLIPBOT_ZIP_KEY missing: refusing to upload unencrypted clips"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLIPBOT_ZIP_KEY -in "$NAME.zip" -out "$NAME.zip.enc"   # public repo: clips stay private
          if gh release view "$NAME" >/dev/null 2>&1; then
            gh release upload "$NAME" "$NAME.zip.enc" --clobber
          else
            gh release create "$NAME" "$NAME.zip.enc" --title "$NAME" --notes "ClipBot run $GITHUB_RUN_ID. Deleted by publish.yml after 30 days."
          fi
      - name: Send to Discord for approval
        if: steps.r.outputs.batch != ''
        run: python -m clipbot.offer --out out --run-id "$GITHUB_RUN_ID"
      - name: Tell the owner it failed
        if: failure()
        run: |
          W=leon; [[ "$CLIPBOT_WHO" =~ ^(leon|glatiar)$ ]] && W=$CLIPBOT_WHO   # another person's failure goes to his own channel
          curl -s -X POST -A "ClipBot/1.0" -H "Authorization: Bearer $CLIPBOT_TOKEN" -H "Content-Type: application/json" \
            -d "{\"id\":\"kick clips job\",\"who\":\"$W\",\"error\":\"GitHub run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed\"}" \
            $CLIPBOT_WORKER/clipbot/failed || true
