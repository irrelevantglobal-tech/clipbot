# Started by the Forge worker (src/clipbot.js) an hour-ish after a stream ends.
name: vod-clips
on:
  workflow_dispatch:
    inputs:
      vod:
        description: Twitch VOD id
        required: true
      from:
        description: window start, VOD seconds (0 + to 0 = whole VOD)
        default: "0"
      to:
        description: window end, VOD seconds (0 = end)
        default: "0"
      picks:
        description: how many clips to pick
        default: "5"
      offer:
        description: send the picks to Discord (false = test run, nothing sent)
        type: boolean
        default: true
      who:
        description: whose stream (leon = TwinkiesGhost, glatiar = Titan)
        default: leon
concurrency:
  group: vod-${{ inputs.vod }}-${{ inputs.from }}
  cancel-in-progress: false
permissions:
  contents: write   # clips are kept as a GitHub Release (artifacts hit the 0.5 GB quota 2026-10-28)
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CLIPBOT_ZIP_KEY: ${{ secrets.CLIPBOT_ZIP_KEY }}   # clip zips + debug files are encrypted (public repo)
      VOD: ${{ inputs.vod }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      PICKS: ${{ inputs.picks }}
      CLIPBOT_WHO: ${{ inputs.who || 'leon' }}
      PYTHONUNBUFFERED: "1"
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CLIPBOT_TOKEN: ${{ secrets.CLIPBOT_TOKEN }}
    steps:
      - name: Check input
        run: '[[ "$VOD" =~ ^[0-9]{6,14}$ && "$FROM" =~ ^[0-9]+$ && "$TO" =~ ^[0-9]+$ && "$PICKS" =~ ^[1-9]$ && "$CLIPBOT_WHO" =~ ^(leon|glatiar)$ ]] || { echo "bad input"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-small.en-v1
      - name: Find the 5 funniest moments
        run: python -m clipbot.find_vod_clips --vod "$VOD" --from "$FROM" --to "$TO" --picks "$PICKS" --out out
      - name: Keep the clips for publish (GitHub Release, not artifact storage)
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ (inputs.from != '0' || inputs.to != '0') && format('{0}-{1}', inputs.vod, inputs.from) || inputs.vod }}
        run: |
          NAME="clips-$BATCH"; [ "$CLIPBOT_WHO" = leon ] || NAME="clips-$CLIPBOT_WHO-$BATCH"   # = common.release_name
          (cd out && shopt -s nullglob && f=(clip*.mp4 raw*.mp4 manifest.json) && zip -0 -q "../$NAME.zip" "${f[@]}")
          [ -n "$CLIPBOT_ZIP_KEY" ] || { echo "CLIPBOT_ZIP_KEY missing: refusing to upload unencrypted clips"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLIPBOT_ZIP_KEY -in "$NAME.zip" -out "$NAME.zip.enc"   # public repo: clips stay private
          if gh release view "$NAME" >/dev/null 2>&1; then
            gh release upload "$NAME" "$NAME.zip.enc" --clobber
          else
            gh release create "$NAME" "$NAME.zip.enc" --title "$NAME" --notes "ClipBot run $GITHUB_RUN_ID. Deleted by publish.yml after 30 days."
          fi
      - name: Send to Discord for approval
        if: inputs.offer
        run: python -m clipbot.offer --out out --run-id "$GITHUB_RUN_ID"
      - name: Tell Leon it failed
        if: failure()
        run: |
          W=leon; [[ "$CLIPBOT_WHO" =~ ^(leon|glatiar)$ ]] && W=$CLIPBOT_WHO   # another person's failure goes to his own channel
          curl -s -X POST -H "Authorization: Bearer $CLIPBOT_TOKEN" -H "Content-Type: application/json" \
            -A "TwinkiesGhost-ClipBot/1.0" -d "{\"id\":\"vod job $VOD from $FROM\",\"who\":\"$W\",\"error\":\"GitHub run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed\"}" \
            https://irrelevant-forge.irrelevantforge.workers.dev/clipbot/failed || true
